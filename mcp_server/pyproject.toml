[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formfill-mcp"
version = "1.0.0"
description = "MCP server for FormFill - fill PDF forms from Claude and any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.9", "httpx>=0.27", "uvicorn>=0.29", "starlette>=0.37"]

[project.scripts]
formfill-mcp = "formfill_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/formfill_mcp"]
